language: php

before_script:
  - travis_retry composer update --prefer-dist $DEPENDENCIES

jobs:
  include:
    - stage: Test
      php: 7.1
      env: DEPENDENCIES=""
      script: php tools/phpunit-wrapper.php

    - stage: Test
      php: 7.1
      env: DEPENDENCIES="--prefer-lowest --prefer-stable"
      script: php tools/phpunit-wrapper.php

    - stage: Test
      php: 7.2
      env: DEPENDENCIES=""
      script: php tools/phpunit-wrapper.php

    - stage: Test
      php: 7.2
      env: DEPENDENCIES="--prefer-lowest --prefer-stable"
      script: php tools/phpunit-wrapper.php

    - stage: Test
      php: 7.4
      env: DEPENDENCIES=""
      script: php tools/phpunit-wrapper.php

    - stage: Test
      php: 8.0
      env: DEPENDENCIES=""
      script: php tools/phpunit-wrapper.php

    - stage: Test
      php: 8.2
      env: DEPENDENCIES=""
      script: php tools/phpunit-wrapper.php

    - stage: Test
      php: 8.4
      env: DEPENDENCIES=""
      script: php tools/phpunit-wrapper.php

    - stage: Test
      php: 8.4
      env: DEPENDENCIES="--prefer-lowest --prefer-stable"
      script: php tools/phpunit-wrapper.php

    - stage: Check Coding Standard
      php: 8.2
      env: DEPENDENCIES=""
      script: vendor/bin/phpcs

    - stage: Static Analysis
      php: 7.1
      env: DEPENDENCIES=""
      before_script:
        - travis_retry composer require --dev --prefer-dist --prefer-stable phpstan/phpstan:^0.10.0
      script: vendor/bin/phpstan analyse -l 5 -c phpstan.neon src

    - stage: Static Analysis
      php: 7.1
      env: DEPENDENCIES=""
      before_script:
        - travis_retry composer require --dev --prefer-dist --prefer-stable vimeo/psalm:2.0.0
      script: vendor/bin/psalm

    - stage: Upload Coverage
      php: 8.4
      env: DEPENDENCIES=""
      before_script:
        - travis_retry composer update --prefer-dist $DEPENDENCIES
        - wget https://scrutinizer-ci.com/ocular.phar
      script:
        - php tools/phpunit-wrapper.php --coverage-text --coverage-clover=clover.xml
        - php ocular.phar code-coverage:upload --format=php-clover clover.xml

cache:
  directories:
    - $HOME/.composer/cache

branches:
  only:
    - "master"
